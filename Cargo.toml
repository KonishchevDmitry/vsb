[package]
name = "vsb"
edition = "2024"
version = "1.1.12"
license = "GPL-3.0+"
keywords = ["backup", "deduplication"]
categories = ["command-line-utilities", "filesystem"]
description = "Very simple in configuring, but powerful backup tool"
exclude = ["/src/tests/testdata"]

authors = ["Dmitry Konishchev <konishchev@gmail.com>"]
repository = "https://github.com/KonishchevDmitry/vsb"
documentation = "https://github.com/KonishchevDmitry/vsb"
readme = "README.md"

[profile.release]
codegen-units = 1
lto = true

[lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"
derive_partial_eq_without_eq = "allow"
redundant_field_names = "allow"
redundant_guards = "allow"
new_ret_no_self = "allow"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
clap = "4.6.7"
const_format = "0.2.37"
cow-utils = "0.1.3"
digest = "0.11.3"
easy-logging = "1.1.0"
expanduser = "1.2.2"
filetime = "0.2.29"
globset = "0.4.21"
hex = "0.4.3"
humansize = "2.1.3"
indoc = "2.0.8"
itertools = "0.15.0"
lazy_static = "1.5.1"
libc = "0.2.191"
log = "0.4.35"
md-5 = "0.11.0"
mime = "0.3.18"
nix = { version = "0.32.0", features = ["fs", "signal", "user"] }
prometheus = "0.14.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
shellexpand = "3.1.2"
tar = "0.4.46"
validator = { version = "0.21.0", features = ["derive"] }
zstd = "0.14.4"

[dev-dependencies]
assert_fs = "1.1.4"
maplit = "1.0.2"
rand = "0.10.4"
rstest = "0.28.0"
